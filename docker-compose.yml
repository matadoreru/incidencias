services:
  db:
    image: postgres:17-alpine
    container_name: incidencias-db
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: incidencias
      POSTGRES_PASSWORD: incidencias
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U incidencias -d incidencias" ]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: incidencias-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/incidencias
      DB_USER: incidencias
      DB_PASSWORD: incidencias
    depends_on:
      db:
        condition: service_healthy
