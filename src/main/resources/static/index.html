<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidencias</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Incidencias</h1>

    <section class="filtro">
        <label for="filtro-estado">Estado</label>
        <select id="filtro-estado">
            <option value="">Todos</option>
            <option value="ABIERTA">Abierta</option>
            <option value="EN_CURSO">En curso</option>
            <option value="CERRADA">Cerrada</option>
        </select>
    </section>

    <p id="mensaje" class="mensaje" hidden></p>

    <table id="tabla-incidencias">
        <thead>
        <tr>
            <th>Id</th>
            <th>Título</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Creada</th>
            <th>Asignada a</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <section class="nueva">
        <h2>Nueva incidencia</h2>
        <form id="form-incidencia">
            <div class="campo">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" type="text" maxlength="100" required>
            </div>
            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="3" maxlength="1000"></textarea>
            </div>
            <div class="campo">
                <label for="prioridad">Prioridad</label>
                <select id="prioridad" name="prioridad" required>
                    <option value="BAJA">Baja</option>
                    <option value="MEDIA" selected>Media</option>
                    <option value="ALTA">Alta</option>
                </select>
            </div>
            <div class="campo">
                <label for="usuarioAsignadoId">Asignar a</label>
                <select id="usuarioAsignadoId" name="usuarioAsignadoId">
                    <option value="">Sin asignar</option>
                </select>
            </div>
            <p id="mensaje-form" class="mensaje" hidden></p>
            <button type="submit">Crear incidencia</button>
        </form>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
